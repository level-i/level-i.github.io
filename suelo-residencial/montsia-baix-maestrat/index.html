<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-I Command Center | Montsià i Baix Maestrat</title>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-panel: #111827;
            --bg-card: #1f2937;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-gold: #C5A059;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }
        
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; scrollbar-width: thin; scrollbar-color: var(--border-color) var(--bg-panel); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); border-left: 1px solid var(--border-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-green); }

        body { background-color: var(--bg-base); color: var(--text-main); display: flex; overflow: hidden; }
        
        aside { width: 260px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
        .brand { font-size: 18px; font-weight: 900; letter-spacing: 1px; color: var(--accent-green); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .brand span.text { color: var(--accent-green); }
        .lowercase-i { text-transform: lowercase; }
        .nav-menu { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: calc(100vh - 100px); }
        .nav-item { background: transparent; border: none; color: var(--text-muted); text-align: left; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-item:hover { background-color: var(--bg-card); color: var(--text-main); }
        .nav-item.active { background-color: var(--bg-card); color: var(--text-main); border-left: 3px solid var(--accent-green); }
        .nav-item.gold-link { color: var(--accent-gold); border: 1px dashed rgba(197, 160, 89, 0.4); margin-top: 10px; }
        .nav-item.gold-link:hover { background-color: rgba(197, 160, 89, 0.1); color: var(--accent-gold); }
        
        main { flex: 1; display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 60px 1fr; height: 100vh; overflow: hidden; }
        header { grid-column: 1 / -1; background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; }
        .header-title { font-size: 13.5px; color: var(--text-muted); }
        .lang-selector { display: flex; gap: 6px; }
        .lang-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }
        
        .content-area { padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* Vídeo en off (muted) por defecto */
        .video-screen-horizontal { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; border: 1px solid var(--border-color); position: relative; overflow: hidden; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .video-screen-horizontal video { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Estilo de la tarjeta de Suelo Residencial */
        .montsia-section { background: linear-gradient(145deg, #121212, #070707); border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .montsia-header-tag { display: flex; align-items: center; margin-bottom: 12px; font-size: 11px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        .gold-pulse-dot { width: 8px; height: 8px; background-color: var(--accent-gold); border-radius: 50%; margin-right: 10px; animation: pulse-gold 2s infinite; }
        .montsia-title { font-size: 19px; line-height: 1.3; margin: 0 0 10px 0; color: #fff; font-weight: 700; }

        .montsia-tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; padding: 15px 0; border-top: 1px solid #222; border-bottom: 1px solid #222; margin-bottom: 15px; }
        .tech-card { background: #161616; border: 1px solid #222; padding: 10px; border-radius: 6px; text-align: center; }
        .tech-label { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .tech-value { font-size: 18px; font-weight: 700; color: var(--accent-gold); }
        .tech-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

        .partner-architecture { display: flex; align-items: center; justify-content: space-between; background: rgba(197, 160, 89, 0.05); border: 1px solid rgba(197, 160, 89, 0.2); border-radius: 8px; padding: 12px 15px; }
        .partner-architecture p { margin: 0; font-size: 12px; color: var(--text-muted); line-height: 1.4; }
        .partner-architecture a { color: var(--accent-gold); font-weight: 600; text-decoration: none; border-bottom: 1px dashed var(--accent-gold); }

        /* --- GALERÍA DE RENDERS --- */
        .renders-gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 20px; }
        .render-card { background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); transition: transform 0.2s ease, border-color 0.2s ease; cursor: pointer; }
        .render-card:hover { transform: translateY(-3px); border-color: var(--accent-gold); }
        .render-card img { width: 100%; height: 140px; object-fit: cover; display: block; }

        /* --- SIMULADOR DE COSTES --- */
        .simulator-box { background: linear-gradient(145deg, #161b22, #0d1117); border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .sim-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sim-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .sim-value-display { font-size: 16px; font-weight: bold; color: var(--accent-green); background: rgba(16,185,129,0.1); padding: 4px 10px; border-radius: 6px; border: 1px dashed var(--accent-green); }
        .slider { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 5px; background: var(--bg-panel); border: 1px solid var(--border-color); outline: none; margin-top: 10px; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-gold); cursor: pointer; }
        
        .result-box { margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--border-color); }
        .result-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .result-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #fff; margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; }

        @keyframes flashLaser { 0% { box-shadow: inset 0 0 0 0 rgba(16, 185, 129, 0); } 50% { box-shadow: inset 0 0 50px 10px rgba(16, 185, 129, 0.4); border-color: var(--accent-green); } 100% { box-shadow: inset 0 0 0 0 rgba(16, 185, 129, 0); } }
        .flash-active { animation: flashLaser 0.5s ease-out; }

        .right-panel { background-color: var(--bg-panel); border-left: 1px solid var(--border-color); padding: 25px; display: flex; flex-direction: column; overflow-y: auto; }
        .right-panel-content { display: flex; flex-direction: column; gap: 16px; }
        .victoria-box { text-align: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; transition: all 0.3s ease; }
        .victoria-avatar { width: 55px; height: 55px; background: linear-gradient(135deg, #3b82f6, #10b981); border-radius: 50%; margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        
        .btn-action { display: block; width: 100%; background-color: var(--accent-green); color: #fff; text-align: center; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; text-decoration: none; margin-top: 15px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: opacity 0.2s; cursor: pointer; border: none;}
        .btn-action:hover { opacity: 0.9; }

        /* --- ESTILOS DEL CAPTCHA Y CHAT --- */
        .captcha-container { display: none; background: var(--bg-panel); border: 1px dashed var(--border-color); border-radius: 8px; padding: 15px; margin-top: 15px; animation: fadeIn 0.3s ease; text-align: left; }
        .captcha-text { font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px; }
        .captcha-input-group { display: flex; gap: 10px; }
        .captcha-input-group input { flex: 1; background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; font-size: 14px; text-align: center; outline: none; }
        .captcha-input-group input:focus { border-color: var(--accent-green); }
        .captcha-input-group button { background: var(--accent-green); color: #fff; border: none; padding: 0 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .captcha-error { border-color: #ef4444 !important; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .chat-interface { display: none; flex-direction: column; height: 320px; background: var(--bg-base); border-radius: 8px; border: 1px solid var(--border-color); margin-top: 15px; overflow: hidden; text-align: left;}
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .bot-message { background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-message { background: var(--accent-green); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .typing-indicator { font-size: 12px; color: var(--text-muted); font-style: italic
