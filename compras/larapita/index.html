<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-I Command Center | Compras La Ràpita</title>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-panel: #111827;
            --bg-card: #1f2937;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Para Firefox */
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) var(--bg-panel);
        }

        /* Personalización de la barra de scroll (Estilo Consola) WebKit */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-green);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* Sidebar Consola */
        sidebar {
            width: 260px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            flex-shrink: 0;
        }
        .brand {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--accent-green);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            max-height: calc(100vh - 150px);
        }
        .nav-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            text-align: left;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover {
            background-color: var(--bg-card);
            color: var(--text-main);
        }
        .nav-item.active {
            background-color: var(--bg-card);
            color: var(--text-main);
            border-left: 3px solid var(--accent-green);
        }
        /* Layout Principal */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            grid-template-rows: 60px 1fr;
            height: 100vh;
            overflow: hidden;
        }
        header {
            grid-column: 1 / -1;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }
        .header-title {
            font-size: 13.5px;
            color: var(--text-muted);
        }
        .lang-selector {
            display: flex;
            gap: 6px;
        }
        .lang-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .lang-btn.active {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
        }
        /* Pantalla Central */
        .content-area {
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .video-screen {
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .video-screen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }
        .video-overlay-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            color: var(--accent-green);
            border: 1px solid var(--border-color);
        }
        .card-main {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
        }
        .card-main h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--text-main);
            line-height: 1.4;
        }
        .card-main p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }
        .highlight {
            color: var(--text-main);
            font-weight: 600;
        }
        /* Panel Lateral Derecho */
        .right-panel {
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }
        .victoria-box {
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .victoria-avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border-radius: 50%;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .btn-action {
            display: block;
            width: 100%;
            background-color: var(--accent-green);
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: opacity 0.2s;
        }
        .btn-action:hover {
            opacity: 0.9;
        }
