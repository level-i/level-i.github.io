<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-i | Hub Operativo Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.75);
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --neon-green: #00ff66;
            --text-main: #f3f4f6;
            --text-muted: #8892b0;
            --border-glow: rgba(0, 243, 255, 0.3);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(176, 0, 255, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .glass-card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="p-6">

    <header class="max-w-xl mx-auto w-full flex justify-between items-center py-4 border-b border-gray-800">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></span>
            <h1 class="text-xl font-bold tracking-wider text-white">LEVEL-I</h1>
        </div>
        <span class="text-xs text-gray-400 uppercase tracking-widest">Motor Operativo SaaS</span>
    </header>

    <main class="max-w-xl mx-auto w-full my-auto py-8">
        <div class="glass-card">
            <span class="text-xs font-semibold text-cyan-400 tracking-wider uppercase">Centro de Accesos y Servicios</span>
            <h2 class="text-xl font-bold mt-2 text-white" style="color: var(--neon-cyan);">¿En qué te podemos ayudar hoy?</h2>
            <p class="text-sm text-gray-400 mt-1 mb-6">Selecciona tu área operativa para iniciar el acceso seguro.</p>

            <div class="space-y-3">
                <!-- BOTÓN 1: REDIRECCIÓN DIRECTA A LA WEB (LO ÚNICO QUE HACE ES MANDARTE ALLÍ) -->
                <button onclick="window.location.href='https://level.immo/acceso-inquilinos'" class="w-full text-left p-4 rounded-xl bg-gray-800/50 hover:bg-blue-600/20 border border-gray-700/50 hover:border-cyan-400 transition-all flex justify-between items-center group">
                    <span class="font-medium text-gray-200 group-hover:text-white">🏠 Inquilinos, Propietarios y Abogados (Alquileres)</span>
                    <span class="text-cyan-400">→</span>
                </button>
                
                <!-- EL RESTO DE BOTONES SOLO SACAN UN AVISO, NO HACEN NADA MÁS -->
                <button onclick="alert('Área en construcción. Disponible próximamente.');" class="w-full text-left p-4 rounded-xl bg-gray-800/50 hover:bg-blue-600/20 border border-gray-700/50 hover:border-cyan-400 transition-all flex justify-between items-center group">
                    <span class="font-medium text-gray-200 group-hover:text-white">🤝 Venta de Propiedades (Sin Comisiones / Advisors)</span>
                    <span class="text-cyan-400">→</span>
                </button>
                <button onclick="alert('Área en construcción. Disponible próximamente.');" class="w-full text-left p-4 rounded-xl bg-gray-800/50 hover:bg-blue-600/20 border border-gray-700/50 hover:border-cyan-400 transition-all flex justify-between items-center group">
                    <span class="font-medium text-gray-200 group-hover:text-white">📈 Inversores (Acceso anticipado cartera 15/30 días)</span>
                    <span class="text-cyan-400">→</span>
                </button>
                <button onclick="alert('Área en construcción. Disponible próximamente.');" class="w-full text-left p-4 rounded-xl bg-gray-800/50 hover:bg-blue-600/20 border border-gray-700/50 hover:border-cyan-400 transition-all flex justify-between items-center group">
                    <span class="font-medium text-gray-200 group-hover:text-white">🌍 Partners Locales y Red de Colaboradores</span>
                    <span class="text-cyan-400">→</span>
                </button>
                <button onclick="alert('Área en construcción. Disponible próximamente.');" class="w-full text-left p-4 rounded-xl bg-gray-800/50 hover:bg-blue-600/20 border border-gray-700/50 hover:border-cyan-400 transition-all flex justify-between items-center group">
                    <span class="font-medium text-gray-200 group-hover:text-white">⚙️ PRO Freelance e Hipotecas Preaprobadas</span>
                    <span class="text-cyan-400">→</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="max-w-xl mx-auto w-full text-center text-xs text-gray-500 py-4 border-t border-gray-800">
        &copy; 2026 Level-i. Actualizaciones diarias en tiempo real. Todos los derechos reservados.
    </footer>

</body>
</html>
