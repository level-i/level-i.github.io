  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #05080f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage-link {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      cursor: pointer;
      text-decoration: none;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .brand-pill {
      background: rgba(8, 13, 20, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .price-pill {
      background: #10b981;
      color: #05080f;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 900;
    }
    .cta-bottom {
      position: absolute;
      bottom: 22px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .cta-btn {
      background: linear-gradient(90deg, #10b981 0%, #059669 100%);
      color: #04090e;
      font-weight: 900;
      font-size: 13px;
      text-align: center;
      padding: 13px 16px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
      animation: pulseBtn 1.8s infinite;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #fbbf24;
      transition: width 0.1s linear;
    }
    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body>

  <!-- Todo el escenario del vídeo es clicable y lleva directo a la Landing -->
  <div class="stage-link" onclick="irALanding()">
    
    <div class="top-bar">
      <div class="brand-pill" translate="no">
        <span>L</span><span class="brand-dot"></span><span>Level.immo</span>
      </div>
      <div class="price-pill">780.000 € · 577 m²</div>
    </div>

    <video id="promo-video" autoplay muted playsinline poster="principal.jpg">
      <source src="promo-11s.mp4" type="video/mp4" />
      <source src="https://app.level-i.com/barcelona/ciutat-vella/activo-angels/promo-11s.mp4" type="video/mp4" />
      <source src="https://level-i.github.io/barcelona/ciutat-vella/activo-angels/promo-11s.mp4" type="video/mp4" />
    </video>

    <div class="cta-bottom">
      <div class="cta-btn">
        🔓 Toca el vídeo para abrir la Ficha Ciega y el Simulador ROI →
      </div>
      <div class="progress-bar-wrap">
        <div id="video-progress" class="progress-bar"></div>
      </div>
    </div>

  </div>

  <script>
    const video = document.getElementById('promo-video');
    const progress = document.getElementById('video-progress');

    // Conserva cualquier parámetro (?ref=SIMP-...&lang=...) al saltar a la landing principal
    function obtenerUrlDestino() {
      const search = window.location.search || '';
      return 'https://app.level-i.com/barcelona/ciutat-vella/activo-angels/' + search;
    }

    function irALanding() {
      window.location.href = obtenerUrlDestino();
    }

    if (video) {
      video.addEventListener('timeupdate', () => {
        if (video.duration) {
          const pct = (video.currentTime / video.duration) * 100;
          progress.style.width = pct + '%';
        }
      });

      // Al terminar los ~17 segundos, salta automáticamente a la landing
      video.addEventListener('ended', () => {
        irALanding();
      });
    }
  </script>
</body>
</html>
