<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL-i // Inmuebles - Bandeja de Avisos</title>
    <!-- Tipografías: IBM moderno y Futurista -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: #0f172a;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border-color: #1e293b;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 2rem 1rem;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'IBM Plex Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--accent);
            padding: 2.5rem;
            border-radius: 8px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px var(--accent-glow);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            color: var(--accent);
            margin: 0;
            letter-spacing: -0.5px;
        }
        .agent-tag {
            font-size: 0.75rem;
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent);
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            text-transform: uppercase;
        }
        p.intro {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }
        input, select, textarea {
            width: 100%;
            background: #060913;
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            color: var(--text-main);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 0.85rem;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s ease, box-shadow 0.2s ease;
            margin-top: 0.5rem;
        }
        .btn-submit:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>BANDEJA AVISOS</h1>
            <span class="agent-tag" id="agent-indicator">Victoria de Carvajal</span>
        </div>
        
        <p class="intro">
            > Módulo: Inmuebles<br>
            > Protocolo de asistencia ejecutiva activo. Complete los campos para registrar la solicitud.
        </p>

        <form id="avisoForm" onsubmit="enviarAviso(event)">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Ej. Joan García">
            </div>

            <div class="form-group">
                <label for="dirigido">Dirigido a</label>
                <select id="dirigido">
                    <option value="Victoria de Carvajal">Victoria de Carvajal</option>
                    <option value="BOT">BOT</option>
                </select>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" required placeholder="Ej. Consulta sobre inmueble disponible">
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" required placeholder="Escriba los detalles de su requerimiento..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Registrar en Bandeja</button>
        </form>
    </div>

    <script>
        function enviarAviso(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const dirigido = document.getElementById('dirigido').value;
            const asunto = document.getElementById('asunto').value;
            const mensaje = document.getElementById('mensaje').value;

            alert(`[FICHA REGISTRADA CORRECTAMENTE]\n\nAtendido por: ${dirigido}\nDe: ${nombre}\nAsunto: ${asunto}\nMensaje: ${mensaje}`);
            
            // Limpiar formulario tras el aviso
            document.getElementById('avisoForm').reset();
        }
    </script>

</body>
</html>
